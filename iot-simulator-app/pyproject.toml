[project]
name = "estateiq-iot-simulator"
version = "1.0.0"
description = "Standalone Multi-Device IoT Simulator for EstateIQ Facility Intelligence Platform"
authors = [{name = "Team Elite", email = "sandeepsmile390@gmail.com"}]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.2"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
