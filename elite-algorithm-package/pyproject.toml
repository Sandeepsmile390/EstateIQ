[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elite-algorithm-package"
version = "1.0.0"
description = "EstateIQ Elite Algorithm Evaluation, Decision Intelligence Pipeline & Metric Validation Package"
authors = [{ name = "Team Elite — BPUT Hackathon 2026" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "joblib>=1.1.0"
]
