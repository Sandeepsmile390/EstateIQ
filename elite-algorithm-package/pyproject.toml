[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "estateiq-dif"
version = "1.1.0"
description = "EstateIQ Decision Intelligence Framework (DIF) anomaly detection and evaluation tools"
authors = [{ name = "Team Elite — BPUT Hackathon 2026" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4"
]

[project.optional-dependencies]
evaluation = ["scikit-learn>=1.0", "matplotlib>=3.5", "seaborn>=0.11", "joblib>=1.1"]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = ".", "src" = "../src" }

[tool.setuptools.packages.find]
where = [".", ".."]
include = ["elite_algo*", "src", "src.intelligence*", "src.data_quality*"]
exclude = ["tests*", "src.tests*", "src.*.tests*"]
